spring.application.name=Community_back-end

# MySQL datasource (fill via environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:community_weblog}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Maps e.g. background_image -> backgroundImage.
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:mapper/**/*.xml

# JWT (override via environment variables in production)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRE_SECONDS:604800}
app.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRE_SECONDS:2592000}

# Rate limiting
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login-max-attempts=${RATE_LIMIT_LOGIN_MAX:5}
app.rate-limit.login-window-seconds=${RATE_LIMIT_LOGIN_WINDOW:300}
app.rate-limit.register-max-attempts=${RATE_LIMIT_REGISTER_MAX:3}
app.rate-limit.register-window-seconds=${RATE_LIMIT_REGISTER_WINDOW:3600}

# Avatar upload (local storage)
app.avatar.upload-dir=${AVATAR_UPLOAD_DIR:../uploads/avatars}
app.avatar.public-path=${AVATAR_PUBLIC_PATH:/avatars}
app.avatar.max-size-bytes=${AVATAR_MAX_SIZE_BYTES:20971520}

# Profile background image upload (local storage)
app.background.upload-dir=${BACKGROUND_UPLOAD_DIR:../uploads/backgrounds}
app.background.public-path=${BACKGROUND_PUBLIC_PATH:/backgrounds}
app.background.max-size-bytes=${BACKGROUND_MAX_SIZE_BYTES:20971520}

# Post cover upload (local storage)
app.post-cover.upload-dir=${POST_COVER_UPLOAD_DIR:../uploads/post-covers}
app.post-cover.public-path=${POST_COVER_PUBLIC_PATH:/post-covers}
app.post-cover.max-size-bytes=${POST_COVER_MAX_SIZE_BYTES:20971520}

# Multipart upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Actuator - expose health and info endpoints (metrics restricted to authenticated)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# WebSocket allowed origins (comma-separated)
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:5173}

# CORS allowed origins (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
